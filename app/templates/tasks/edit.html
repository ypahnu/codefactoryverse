{% extends "base.html" %}
{% block title %}Edit {{ task.title }}{% endblock %}
{% block content %}
<div class="container py-4" style="max-width:700px;">
  <a href="{{ url_for('tasks.view', team_slug=team.slug, project_slug=project.slug, task_id=task.id) }}" class="btn btn-ghost btn-sm mb-3"><i class="bi bi-arrow-left"></i> Back to Task</a>
  <div class="card-custom p-4">
    <h4 class="fw-bold">Edit Task</h4>
    <form method="POST" class="mt-3">
      <div class="mb-3"><label class="form-label small">Title</label><input name="title" class="form-control" value="{{ task.title }}" required></div>
      <div class="mb-3"><label class="form-label small">Briefing (visible)</label><textarea name="description" class="form-control" rows="3">{{ task.description }}</textarea></div>
      <div class="mb-3"><label class="form-label small">Full Prompt (hidden behind +)</label><textarea name="full_prompt" class="form-control" rows="6">{{ task.full_prompt }}</textarea></div>
      <div class="row">
        <div class="col-6 mb-3"><label class="form-label small">Status</label>
          <select name="status" class="form-select">
            {% for s in ['todo','in_progress','done','blocked'] %}<option value="{{ s }}" {% if task.status==s %}selected{% endif %}>{{ s }}</option>{% endfor %}
          </select>
        </div>
        <div class="col-6 mb-3"><label class="form-label small">Priority</label>
          <select name="priority" class="form-select">
            {% for p in ['low','medium','high','critical'] %}<option value="{{ p }}" {% if task.priority==p %}selected{% endif %}>{{ p }}</option>{% endfor %}
          </select>
        </div>
      </div>
      <button class="btn btn-primary-custom w-100">Save</button>
    </form>
  </div>
</div>
{% endblock %}
